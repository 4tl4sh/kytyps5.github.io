<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>KytyPS5 — Opening page…</title>
    <script>
      // GitHub Pages has no history fallback. Carry the whole route in the URL
      // so private browsing/storage restrictions cannot lose queries or hashes.
      if (location.pathname !== "/") {
        location.replace(
          "/?__kyty_path=" +
            encodeURIComponent(
              location.pathname + location.search + location.hash,
            ),
        );
      }
    </script>
  </head>
  <body>
    <p>Opening <a href="/">KytyPS5</a>…</p>
  </body>
</html>
